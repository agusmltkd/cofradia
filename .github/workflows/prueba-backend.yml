name: Prueba del backend

# Comprueba que Supabase activa, sincroniza y firma bien los tokens.
# Actions → "Prueba del backend" → Run workflow → pega un código de prueba.
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: 'Código de activación de prueba (ABCD-1234)'
        required: true

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node supabase/prueba-backend.mjs "${{ inputs.codigo }}"
