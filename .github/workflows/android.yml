name: App Android

# Compila la app en la nube. No necesitas Android Studio para obtener un APK:
# haz push (o lanza el workflow a mano) y descárgalo de la pestaña Actions.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'Generar AAB firmado para Google Play'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión
        run: |
          echo "VERSION_CODE=$(( 100 + ${{ github.run_number }} ))" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Tests del núcleo
        run: ./gradlew :core:test --no-daemon

      - name: APK de pruebas
        run: ./gradlew :app:assembleDebug --no-daemon -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: statio-pruebas-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ env.VERSION_NAME }}
          path: android/core/build/reports/tests/
          retention-days: 7

      # Capturas reales de las pantallas (sin emulador) para revisar el diseño
      # y para la ficha de Google Play.
      - name: Capturas de pantalla
        continue-on-error: true
        run: ./gradlew :app:recordPaparazziDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-${{ env.VERSION_NAME }}
          path: android/app/src/test/snapshots/images/
          retention-days: 30

      # ---- Release firmado (solo a mano, con la casilla marcada) ----
      # Sin secretos configurados se genera igualmente, pero SIN firmar (sirve
      # para comprobar que compila; Google Play solo acepta el firmado).
      - name: Restaurar keystore
        if: inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/subida.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/subida.jks" >> $GITHUB_ENV
            echo "Keystore restaurado: el AAB saldrá firmado."
          else
            echo "::warning::No hay secretos de firma: el AAB saldrá SIN firmar."
          fi

      - name: AAB y APK de release
        if: inputs.release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: statio-release-${{ env.VERSION_NAME }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      # Las capturas también se guardan en la rama `capturas` (carpeta docs/capturas),
      # para verlas en GitHub sin descargar nada.
      - name: Publicar capturas en la rama capturas
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: .
        run: |
          set -e
          mkdir -p /tmp/capturas && cp android/app/src/test/snapshots/images/*.png /tmp/capturas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan capturas
          git rm -rfq . && git clean -fdxq
          mkdir -p docs/capturas && cp /tmp/capturas/*.png docs/capturas/
          git add docs/capturas
          git commit -qm "Capturas ${{ env.VERSION_NAME }}"
          git push -f origin capturas
