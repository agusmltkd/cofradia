<script>
// ===========================================================================
// Statio · Panel de administración
// Un único archivo, sin build. Habla con Supabase usando la clave publicable;
// lo que cada uno ve lo deciden las políticas RLS de la base de datos.
// ===========================================================================
// Símbolo de Statio: una S de paradas que acaba en el punto fijo (ver marca/).
const SUPABASE_URL = "https://sujxkxghtwesotegfvth.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y6RsOO1DkouE3ixhTCmA-A_Q6V8SwlJ";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MARCA = `<svg style="width:26px;height:26px" viewBox="26 28 58 58" aria-hidden="true"><circle cx="70.0" cy="36.0" r="4.8" fill="currentColor"/><circle cx="62.89" cy="29.1" r="3.4" fill="currentColor"/><circle cx="52.32" cy="28.33" r="3.4" fill="currentColor"/><circle cx="42.3" cy="31.75" r="3.4" fill="currentColor"/><circle cx="38.1" cy="40.86" r="3.4" fill="currentColor"/><circle cx="44.91" cy="48.59" r="3.4" fill="currentColor"/><circle cx="54.84" cy="52.48" r="3.4" fill="currentColor"/><circle cx="64.54" cy="56.84" r="3.4" fill="currentColor"/><circle cx="69.99" cy="65.41" r="3.4" fill="currentColor"/><circle cx="65.53" cy="74.69" r="3.4" fill="currentColor"/><circle cx="55.68" cy="78.44" r="3.4" fill="currentColor"/><circle cx="45.11" cy="77.85" r="3.4" fill="currentColor"/><path d="M38,63.4L45.6,71L38,78.6L30.4,71Z" fill="var(--acento,#D8A24A)"/></svg>`;

const E = { usuario: null, superadmin: false, hermandades: [], hid: null, vista: "itinerarios", cache: {} };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("v"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("v"), 2600); }
function fallo(error) { if (error) { console.error(error); toast("Error: " + (error.message || error)); return true; } return false; }

// ---------------------------------------------------------------- escudo
/** El escudo de la hermandad o, si no tiene, sus iniciales sobre su color. */
function escudoHtml(h, tam = 40) {
  if (h?.escudo_url) return `<img src="${esc(h.escudo_url)}" alt="" style="width:${tam}px;height:${tam}px;object-fit:contain;flex:none">`;
  const ini = String(h?.nombre_corto || h?.nombre || "?").replace(/^(hermandad|hdad\.?|cofrad[ií]a)\s+(de\s+)?(la\s+|el\s+|los\s+|las\s+)?/i, "").split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
  return `<span style="width:${tam}px;height:${tam}px;border-radius:50%;background:${esc(h?.color || "#7A2E3A")};color:#fff;display:inline-grid;place-items:center;font-weight:600;font-size:${Math.round(tam * 0.38)}px;flex:none">${esc(ini)}</span>`;
}
/** Reduce la imagen a 512 px como mucho y la devuelve como PNG (mantiene la transparencia). */
function prepararEscudo(archivo) {
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 512 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => (b ? ok(b) : mal(new Error("No se pudo procesar la imagen"))), "image/png");
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => mal(new Error("Ese archivo no es una imagen válida"));
    img.src = URL.createObjectURL(archivo);
  });
}

// ---------------------------------------------------------------- tiempo
const fmtHora = (m) => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const parseHora = (t) => { const r = /^\s*(\d{1,2})[:.h](\d{2})\s*$/.exec(String(t ?? "")); if (!r) return null; const h = +r[1], m = +r[2]; return h > 47 || m > 59 ? null : h * 60 + m; };
const fmtFecha = (s) => s ? new Date(s).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" }) : "—";
const slug = (s) => String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);

// ---------------------------------------------------------------- modelo
/** Itinerario (datos) → tabla editable: una fila por punto, hora y parón por sección. */
function aTabla(datos) {
  const filas = datos.puntos.map((p) => ({ nombre: p.nombre, ancla: !!p.ancla, nota: p.nota || "", voz: p.voz || "", s: {} }));
  for (const s of datos.secciones) {
    let t = s.salida;
    filas[0].s[s.id] = { hora: t, paron: null, estimado: false };
    s.tramos.forEach((tr, i) => { t += tr.andar + tr.paron; filas[i + 1].s[s.id] = { hora: t, paron: tr.paron, estimado: !!tr.estimado }; });
  }
  return { secciones: datos.secciones.map((s) => ({ id: s.id, nombre: s.nombre })), filas };
}
/** Tabla → datos. El parón de la fila i es el tiempo parado en el tramo que llega a ese punto. */
function deTabla(tabla) {
  const puntos = tabla.filas.map((f, i) => {
    const p = { id: String(i).padStart(2, "0") + "-" + (slug(f.nombre) || "punto"), nombre: f.nombre.trim(), ancla: !!f.ancla };
    if (f.nota?.trim()) p.nota = f.nota.trim();
    if (f.voz?.trim()) p.voz = f.voz.trim();
    return p;
  });
  const secciones = tabla.secciones.map((s) => {
    const horas = [];
    let suma = 0, prev = null;
    for (const f of tabla.filas) {
      let h = f.s[s.id]?.hora;
      if (h == null) throw new Error(`Falta la hora de «${s.nombre}» en «${f.nombre}»`);
      h += suma;
      if (prev != null && h < prev - 600) { suma += 1440; h += 1440; } // cruza la medianoche
      horas.push(h); prev = h;
    }
    const tramos = [];
    for (let i = 1; i < horas.length; i++) {
      const total = horas[i] - horas[i - 1];
      if (total < 0) throw new Error(`«${s.nombre}» llega a «${tabla.filas[i].nombre}» antes que al punto anterior`);
      const celda = tabla.filas[i].s[s.id] || {};
      const vacio = celda.paron == null || celda.paron === "";
      const paron = vacio ? Math.round(total * 0.35) : Math.min(total, Math.max(0, +celda.paron));
      const estimado = vacio || celda.estimado === true;
      tramos.push(estimado ? { andar: total - paron, paron, estimado: true } : { andar: total - paron, paron });
    }
    return { id: s.id, nombre: s.nombre, salida: horas[0], tramos };
  });
  return { puntos, secciones };
}
/** Mismas reglas que la app (core/Validacion.kt). */
function validar(d) {
  const out = [];
  const g = (t) => out.push({ grave: true, t }), l = (t) => out.push({ grave: false, t });
  if (d.puntos.length < 2) g("El itinerario necesita al menos dos puntos.");
  if (!d.secciones.length) g("No hay ninguna sección.");
  if (d.puntos[0]?.ancla) g("La salida no puede ser un punto de horario fijo.");
  if (!d.puntos.some((p) => p.ancla)) l("No hay ningún punto de horario fijo (Campana, Catedral…): el recálculo apuntará al último punto.");
  const vistos = {};
  d.puntos.forEach((p) => { const k = p.nombre.toLowerCase(); if (vistos[k]) l(`Hay varios puntos llamados «${p.nombre}». Añade algo que los distinga (ida/vuelta).`); vistos[k] = 1; if (!p.nombre) g("Hay un punto sin nombre."); });
  for (const s of d.secciones) {
    if (s.tramos.length !== d.puntos.length - 1) g(`«${s.nombre}»: número de tramos incorrecto.`);
    s.tramos.forEach((t, i) => { if (t.andar + t.paron > 90) l(`«${s.nombre}»: más de hora y media hasta ${d.puntos[i + 1].nombre}.`); });
    if (s.tramos.some((t) => t.estimado)) l(`«${s.nombre}»: hay parones sin rellenar; se estiman al 35% del tramo. Revísalos con el capataz.`);
  }
  return out;
}
const vacioDatos = () => ({
  puntos: [{ id: "00-salida", nombre: "Salida", ancla: false }, { id: "01-campana", nombre: "Campana (palquillo)", ancla: true }, { id: "02-entrada", nombre: "Entrada", ancla: false }],
  secciones: [{ id: "cruz", nombre: "Cruz de guía", salida: 18 * 60, tramos: [{ andar: 60, paron: 30 }, { andar: 120, paron: 60 }] }],
});

// ---------------------------------------------------------------- Excel
const CAB_PUNTO = "Punto", CAB_FIJO = "Horario fijo", CAB_NOTA = "Nota", CAB_VOZ = "Pronunciación";
function descargarPlantilla(tabla, nombre = "plantilla-itinerario") {
  tabla = tabla || aTabla(vacioDatos());
  const cab = [CAB_PUNTO, CAB_FIJO, CAB_NOTA, CAB_VOZ];
  tabla.secciones.forEach((s) => cab.push(`${s.nombre} · hora`, `${s.nombre} · parón (min)`));
  const filas = tabla.filas.map((f, i) => {
    const r = [f.nombre, f.ancla ? "sí" : "", f.nota, f.voz];
    tabla.secciones.forEach((s) => { const c = f.s[s.id] || {}; r.push(fmtHora(c.hora ?? 0), i === 0 || c.estimado || c.paron == null ? "" : c.paron); });
    return r;
  });
  const ayuda = [
    ["Cómo rellenar la plantilla"], [""],
    ["· Una fila por punto del recorrido, en orden, empezando por la salida."],
    ["· «Horario fijo»: escribe «sí» en los puntos innegociables (palquillo de la Campana, Catedral…). Nunca en la salida."],
    ["· Por cada sección (cruz de guía, cada paso…) hay dos columnas: la HORA de paso (20:15) y los MINUTOS PARADO en el tramo que llega a ese punto."],
    ["· Si no sabes los minutos parado, déjalos en blanco: se estimarán y la app avisará de que son estimados."],
    ["· Pasada la medianoche puedes escribir 00:30 o 24:30; las dos valen."],
    ["· «Pronunciación» es opcional: cómo quieres que lo diga la voz si el nombre escrito no suena bien."],
    ["· Para añadir una sección, copia las dos columnas de otra y cambia el nombre antes de « · »."],
  ];
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([cab, ...filas]);
  ws["!cols"] = cab.map((c, i) => ({ wch: i === 0 ? 38 : i < 4 ? 14 : 18 }));
  XLSX.utils.book_append_sheet(wb, ws, "Itinerario");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ayuda), "Instrucciones");
  XLSX.writeFile(wb, nombre + ".xlsx");
}
function leerExcel(archivo) {
  return archivo.arrayBuffer().then((buf) => {
    const wb = XLSX.read(buf, { cellDates: false });
    const ws = wb.Sheets["Itinerario"] || wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" });
    const cab = filas[0].map((c) => String(c).trim());
    const iP = cab.indexOf(CAB_PUNTO);
    if (iP < 0) throw new Error(`Falta la columna «${CAB_PUNTO}». Usa la plantilla.`);
    const secciones = [];
    cab.forEach((c, i) => {
      const m = /^(.*)\s·\shora$/i.exec(c);
      if (m) { const nombre = m[1].trim(); secciones.push({ id: slug(nombre) || "s" + i, nombre, iH: i, iP: cab.findIndex((x) => x.toLowerCase().startsWith(nombre.toLowerCase() + " · par")) }); }
    });
    if (!secciones.length) throw new Error("No encuentro columnas «… · hora». Usa la plantilla.");
    const tabla = { secciones: secciones.map(({ id, nombre }) => ({ id, nombre })), filas: [] };
    for (const r of filas.slice(1)) {
      const nombre = String(r[iP] ?? "").trim();
      if (!nombre) continue;
      const f = { nombre, ancla: /^(s[ií]|x|1|true)$/i.test(String(r[cab.indexOf(CAB_FIJO)] ?? "").trim()), nota: r[cab.indexOf(CAB_NOTA)] ?? "", voz: r[cab.indexOf(CAB_VOZ)] ?? "", s: {} };
      for (const s of secciones) {
        let crudo = r[s.iH];
        // Excel puede devolver la hora como fracción de día (0.8541…)
        if (/^\d*\.\d+$/.test(String(crudo))) { const m = Math.round(parseFloat(crudo) * 1440); crudo = fmtHora(m); }
        const hora = parseHora(crudo);
        if (hora == null) throw new Error(`Hora no válida en «${nombre}» / ${s.nombre}: «${crudo}»`);
        const pa = s.iP >= 0 ? String(r[s.iP] ?? "").trim() : "";
        f.s[s.id] = { hora, paron: pa === "" ? null : +pa };
      }
      tabla.filas.push(f);
    }
    return tabla;
  });
}

// ---------------------------------------------------------------- arranque
async function iniciar() {
  // El enlace de "he olvidado mi contraseña" vuelve aquí con una sesión temporal:
  // en ese caso se pide la contraseña nueva antes de entrar.
  db.auth.onAuthStateChange((ev, s) => {
    if (ev === "PASSWORD_RECOVERY") { E.recuperando = true; E.usuario = s?.user ?? null; return pintarLogin("nueva"); }
    const antes = E.usuario?.id; E.usuario = s?.user ?? null;
    if (antes !== E.usuario?.id && !E.recuperando) cargar();
  });
  const { data } = await db.auth.getSession();
  E.usuario = data.session?.user ?? null;
  if (!E.recuperando) cargar();
}

async function cargar() {
  if (!E.usuario) return pintarLogin("entrar");
  const [{ data: su }, { data: hs, error }] = await Promise.all([
    db.from("superadmins").select("email").maybeSingle(),
    db.from("hermandades").select("*").order("nombre"),
  ]);
  if (fallo(error)) return;
  E.superadmin = !!su;
  E.hermandades = hs || [];
  if (!E.hermandades.find((h) => h.id === E.hid)) E.hid = E.hermandades[0]?.id ?? null;
  pintar();
}

/** Supabase responde en inglés: lo traducimos a algo que se entienda. */
function errorAcceso(e) {
  const m = String(e?.message || e);
  if (/invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos.";
  if (/email not confirmed/i.test(m)) return "Aún no has confirmado tu correo. Abre el enlace que te enviamos al crear la cuenta.";
  if (/already registered|already exists/i.test(m)) return "Ya hay una cuenta con ese correo. Entra o recupera la contraseña.";
  if (/password should be at least|weak password/i.test(m)) return "La contraseña es demasiado corta: usa al menos 8 caracteres.";
  if (/rate limit|too many/i.test(m)) return "Demasiados intentos. Espera unos minutos y vuelve a probar.";
  if (/same.*password|different from the old/i.test(m)) return "La contraseña nueva tiene que ser distinta de la anterior.";
  return m;
}
const URL_PANEL = location.origin + location.pathname;

function pintarLogin(modo = "entrar", info = "") {
  const vistas = {
    entrar: `<h2>Entrar</h2><p class="sub" style="margin:6px 0 18px">Panel para administradores de hermandad.</p>
      <form id="fl" class="col">
        <label class="campo">Correo<input type="email" name="email" required autocomplete="username" autofocus></label>
        <label class="campo">Contraseña<input type="password" name="clave" required autocomplete="current-password"></label>
        <button class="b p" style="justify-content:center">Entrar</button>
      </form>
      <div class="fila" style="justify-content:space-between;margin-top:14px;font-size:14px">
        <a href="#" data-modo="olvido">He olvidado mi contraseña</a><a href="#" data-modo="crear">Crear cuenta</a>
      </div>`,
    crear: `<h2>Crear cuenta</h2><p class="sub" style="margin:6px 0 18px">Usa el mismo correo con el que te ha dado de alta tu hermandad. Si no, entrarás pero no verás ninguna.</p>
      <form id="fl" class="col">
        <label class="campo">Correo<input type="email" name="email" required autocomplete="username" autofocus></label>
        <label class="campo">Contraseña (mínimo 8 caracteres)<input type="password" name="clave" required minlength="8" autocomplete="new-password"></label>
        <label class="campo">Repite la contraseña<input type="password" name="clave2" required minlength="8" autocomplete="new-password"></label>
        <button class="b p" style="justify-content:center">Crear cuenta</button>
      </form>
      <div style="margin-top:14px;font-size:14px"><a href="#" data-modo="entrar">Ya tengo cuenta</a></div>`,
    olvido: `<h2>Recuperar contraseña</h2><p class="sub" style="margin:6px 0 18px">Te enviamos un enlace para poner una contraseña nueva.</p>
      <form id="fl" class="col">
        <label class="campo">Correo<input type="email" name="email" required autocomplete="username" autofocus></label>
        <button class="b p" style="justify-content:center">Enviar enlace</button>
      </form>
      <div style="margin-top:14px;font-size:14px"><a href="#" data-modo="entrar">Volver</a></div>`,
    nueva: `<h2>Contraseña nueva</h2><p class="sub" style="margin:6px 0 18px">Elige la contraseña con la que entrarás a partir de ahora.</p>
      <form id="fl" class="col">
        <label class="campo">Contraseña nueva<input type="password" name="clave" required minlength="8" autocomplete="new-password" autofocus></label>
        <label class="campo">Repítela<input type="password" name="clave2" required minlength="8" autocomplete="new-password"></label>
        <button class="b p" style="justify-content:center">Guardar y entrar</button>
      </form>`,
    revisa: `<h2>Revisa tu correo</h2><p class="sub" style="margin:6px 0 18px">${info}</p>
      <button class="b" data-modo="entrar">Volver a entrar</button>`,
  };
  $("#app").innerHTML = `<div class="login"><div class="tarjeta">
    <div class="marca" style="padding:0 0 22px">${MARCA}<span>Statio · Panel</span></div>
    ${vistas[modo]}<div id="errLogin" class="aviso grave" style="display:none;margin-top:14px"></div></div></div>`;
  document.querySelectorAll("[data-modo]").forEach((a) => a.addEventListener("click", (ev) => { ev.preventDefault(); pintarLogin(a.dataset.modo); }));
  const mostrar = (t) => { const el = $("#errLogin"); el.textContent = t; el.style.display = t ? "block" : "none"; };
  $("#fl")?.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const v = Object.fromEntries(new FormData(ev.target));
    const email = String(v.email || "").trim().toLowerCase();
    const boton = ev.target.querySelector("button"); boton.disabled = true;
    try {
      if ((modo === "crear" || modo === "nueva") && v.clave !== v.clave2) throw new Error("Las dos contraseñas no coinciden.");
      if (modo === "entrar") {
        const { error } = await db.auth.signInWithPassword({ email, password: v.clave });
        if (error) throw error;
      } else if (modo === "crear") {
        const { data, error } = await db.auth.signUp({ email, password: v.clave, options: { emailRedirectTo: URL_PANEL } });
        if (error) throw error;
        // Si el proyecto pide confirmar el correo, no hay sesión todavía.
        if (!data.session) return pintarLogin("revisa", `Te hemos enviado un enlace a <b>${esc(email)}</b> para confirmar la cuenta. Ábrelo y después entra con tu contraseña.`);
      } else if (modo === "olvido") {
        const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: URL_PANEL });
        if (error) throw error;
        return pintarLogin("revisa", `Si <b>${esc(email)}</b> tiene cuenta, le llegará un enlace para poner una contraseña nueva. Ábrelo en este mismo navegador.`);
      } else if (modo === "nueva") {
        const { error } = await db.auth.updateUser({ password: v.clave });
        if (error) throw error;
        E.recuperando = false;
        history.replaceState(null, "", URL_PANEL);
        toast("Contraseña guardada");
        return cargar();
      }
    } catch (e) {
      mostrar(errorAcceso(e));
    } finally {
      boton.disabled = false;
    }
  });
}

// ---------------------------------------------------------------- estructura
const VISTAS = [

  const h = E.hermandades.find((x) => x.id === E.hid);
  const vistas = E.superadmin ? [...VISTAS, ...VISTAS_SUPER] : VISTAS;
  $("#app").innerHTML = `

        ${h ? `<div class="fila" style="gap:10px;margin-top:12px;flex-wrap:nowrap">${escudoHtml(h, 36)}<span style="font-size:13px;line-height:1.3;color:var(--tinta2)">${esc(h.nombre)}</span></div>` : ""}

      <nav>${h ? vistas.map(([k, t]) => `<button data-v="${k}" class="${E.vista === k ? "on" : ""}">${t}</button>`).join("") : ""}</nav>
      <div style="padding:22px 10px 0;font-size:13px;color:var(--tinta3)">
        ${esc(E.usuario.email)}${E.superadmin ? " · superadmin" : ""}<br>
        <a href="#" onclick="db.auth.signOut();return false">Cerrar sesión</a>
      </div>
    </aside>
    <main id="main">${h ? "" : `<h1>Sin hermandades</h1><p class="sub">${E.superadmin ? "Crea la primera con «Nueva hermandad»." : "Tu correo no está dado de alta como administrador de ninguna hermandad. Pídeselo a quien te dio acceso."}</p>`}</main>
  </div>`;
  $("#selH")?.addEventListener("change", (e) => { E.hid = e.target.value; pintar(); });
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { E.vista = b.dataset.v; pintar(); }));
  if (h) ({ itinerarios: vItinerarios, codigos: vCodigos, dispositivos: vDispositivos, hermandad: vHermandad, licencias: vLicencias, admins: vAdmins }[E.vista] || vItinerarios)(h);
}

function abrirDialogo(html, alEnviar) {
  const d = $("#dlg");
  d.innerHTML = html;
  d.showModal();
  d.querySelector("[data-cerrar]")?.addEventListener("click", () => d.close());
  d.querySelector("form")?.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const ok = await alEnviar(Object.fromEntries(new FormData(ev.target)));
    if (ok !== false) d.close();
  });
}

// ---------------------------------------------------------------- itinerarios
async function vItinerarios(h) {
  const m = $("#main");
  const { data: its, error } = await db.from("itinerarios").select("id,nombre,orden,publicado,version,actualizado,actualizado_por,datos").eq("hermandad_id", h.id).order("orden");

  m.innerHTML = `
    <div class="fila"><div><div class="rotulo">${esc(h.nombre)}</div><h1>Itinerarios</h1></div><div class="esp"></div>
      <button class="b" onclick="descargarPlantilla()">Descargar plantilla Excel</button>
      <label class="b" style="cursor:pointer">Importar Excel<input type="file" accept=".xlsx,.xls,.csv" hidden id="fx"></label>
      <button class="b p" onclick="nuevoItinerario()">+ Nuevo</button></div>

              ${inc.some((x) => x.grave) ? `<span class="pastilla" style="--c:var(--mal)">con errores</span>` : ""}</td>
          <td style="color:var(--tinta2);font-size:13px">${fmtFecha(it.actualizado)}<br>${esc(it.actualizado_por || "")}</td>

            <button class="b mini" onclick="editarItinerario('${it.id}')">Editar</button>

function nuevoItinerario() { abrirEditor(E.hermandades.find((x) => x.id === E.hid), { nombre: "Itinerario oficial", tabla: aTabla(vacioDatos()), nuevo: true }); }
function editarItinerario(id) { const it = E.cache.its.find((x) => x.id === id); abrirEditor(E.hermandades.find((x) => x.id === E.hid), { id, nombre: it.nombre, tabla: aTabla(it.datos), publicado: it.publicado }); }
function exportarItinerario(id) { const it = E.cache.its.find((x) => x.id === id); descargarPlantilla(aTabla(it.datos), slug(it.nombre)); }
async function publicar(id, si) {
  const it = E.cache.its.find((x) => x.id === id);
  if (si && validar(it.datos).some((x) => x.grave)) return toast("Corrige los errores antes de publicar.");
  const { error } = await db.from("itinerarios").update({ publicado: si }).eq("id", id);
  if (!fallo(error)) { toast(si ? "Publicado. Llegará a los móviles al sincronizar." : "Retirado de los móviles."); pintar(); }
}

function abrirEditor(h, ed) {
  E.ed = ed;
  const m = $("#main");
  const t = ed.tabla;
  m.innerHTML = `
    <div class="fila"><button class="b mini" onclick="pintar()">‹ Itinerarios</button></div>
    <div class="fila" style="margin:14px 0 6px">
      <input id="edNombre" value="${esc(ed.nombre)}" style="font-size:22px;font-weight:600;flex:1;min-width:240px">
      <button class="b" onclick="edSeccion()">+ Sección</button>
      <button class="b" onclick="edFila()">+ Punto</button>
      <button class="b p" onclick="edGuardar()">Guardar</button>
      ${ed.id ? `<button class="b peligro" onclick="edBorrar()">Borrar</button>` : ""}
    </div>
    <p class="sub">Hora de paso de cada sección por cada punto y minutos parado en el tramo que llega a él. Si dejas el parón en blanco se estima. Marca los puntos de <b>horario fijo</b>.</p>
    <div id="edAvisos"></div>
    <div class="editor"><table><thead><tr><th style="width:34px">#</th><th style="min-width:240px">Punto</th><th>Fijo</th><th style="min-width:160px">Nota</th>
      ${t.secciones.map((s, k) => `<th colspan="2"><input value="${esc(s.nombre)}" data-sec="${k}" style="font-weight:600;padding:4px 6px;width:150px">
        ${t.secciones.length > 1 ? `<button class="b mini" title="Quitar sección" onclick="edQuitarSeccion(${k})">×</button>` : ""}<br><span style="font-weight:500">hora · parón</span></th>`).join("")}
      <th></th></tr></thead><tbody>
      ${t.filas.map((f, i) => `<tr class="${f.ancla ? "fijo" : ""}">
        <td class="num" style="color:var(--tinta3)">${i}</td>
        <td><input value="${esc(f.nombre)}" data-f="${i}" data-k="nombre"></td>
        <td style="text-align:center"><input type="checkbox" ${f.ancla ? "checked" : ""} data-f="${i}" data-k="ancla" ${i === 0 ? "disabled" : ""} style="width:auto"></td>
        <td><input value="${esc(f.nota)}" data-f="${i}" data-k="nota" placeholder="—"></td>
        ${t.secciones.map((s) => { const c = f.s[s.id] || {}; return `
          <td><input class="h" value="${c.hora != null ? fmtHora(c.hora) : ""}" data-f="${i}" data-s="${s.id}" data-k="hora"></td>
          <td><input class="m num ${c.estimado ? "est" : ""}" title="${c.estimado ? "Estimado: revísalo con el capataz" : ""}" value="${i === 0 || c.paron == null ? "" : c.paron}" ${i === 0 ? "disabled" : ""} placeholder="${i === 0 ? "" : "~"}" data-f="${i}" data-s="${s.id}" data-k="paron"></td>`; }).join("")}
        <td style="white-space:nowrap"><button class="b mini" onclick="edFila(${i})" title="Insertar debajo">+</button> <button class="b mini" onclick="edQuitarFila(${i})" title="Quitar">×</button></td>
      </tr>`).join("")}
    </tbody></table></div>`;
  m.querySelectorAll("[data-f]").forEach((el) => el.addEventListener("change", () => {
    const f = t.filas[+el.dataset.f], k = el.dataset.k;
    if (el.dataset.s) {
      const c = (f.s[el.dataset.s] ||= {});
      if (k === "hora") { const v = parseHora(el.value); if (v == null) { toast("Hora no válida. Usa 20:15"); el.value = c.hora != null ? fmtHora(c.hora) : ""; return; } c.hora = v; el.value = fmtHora(v); }
      else { c.paron = el.value === "" ? null : Math.max(0, Math.round(+el.value)); c.estimado = el.value === ""; el.classList.toggle("est", c.estimado); el.title = ""; }
    } else if (k === "ancla") { f.ancla = el.checked; el.closest("tr").classList.toggle("fijo", el.checked); }
    else f[k] = el.value;
    edValidar();
  }));
  m.querySelectorAll("[data-sec]").forEach((el) => el.addEventListener("change", () => { t.secciones[+el.dataset.sec].nombre = el.value.trim() || "Sección"; }));
  edValidar();
}
function edValidar() {
  let html = "";
  try { const inc = validar(deTabla(E.ed.tabla)); html = inc.map((x) => `<div class="aviso ${x.grave ? "grave" : ""}">${esc(x.t)}</div>`).join(""); }
  catch (e) { html = `<div class="aviso grave">${esc(e.message)}</div>`; }
  $("#edAvisos").innerHTML = html;
}
function edFila(i) {
  const t = E.ed.tabla; i = i ?? t.filas.length - 1;
  const base = t.filas[i];
  const nueva = { nombre: "Nuevo punto", ancla: false, nota: "", voz: "", s: {} };
  t.secciones.forEach((s) => { nueva.s[s.id] = { hora: (base?.s[s.id]?.hora ?? 1080) + 5, paron: null }; });
  t.filas.splice(i + 1, 0, nueva);
  abrirEditor(null, E.ed);
}
function edQuitarFila(i) { if (E.ed.tabla.filas.length <= 2) return toast("Hacen falta al menos dos puntos."); E.ed.tabla.filas.splice(i, 1); abrirEditor(null, E.ed); }
function edSeccion() {
  const t = E.ed.tabla, nombre = prompt("Nombre de la sección (p. ej. Paso de palio):"); if (!nombre) return;
  let id = slug(nombre) || "seccion"; while (t.secciones.some((s) => s.id === id)) id += "-2";
  const ref = t.secciones[t.secciones.length - 1];
  t.secciones.push({ id, nombre });
  t.filas.forEach((f) => { f.s[id] = { hora: (f.s[ref.id]?.hora ?? 1080) + 25, paron: f.s[ref.id]?.paron ?? null, estimado: f.s[ref.id]?.estimado }; });
  abrirEditor(null, E.ed);
}
function edQuitarSeccion(k) { if (!confirm("¿Quitar esta sección?")) return; E.ed.tabla.secciones.splice(k, 1); abrirEditor(null, E.ed); }
async function edGuardar() {
  let datos;
  try { datos = deTabla(E.ed.tabla); } catch (e) { return toast(e.message); }
  const inc = validar(datos);
  const nombre = $("#edNombre").value.trim() || "Itinerario";
  if (inc.some((x) => x.grave) && E.ed.publicado) return toast("Tiene errores: corrígelos o retíralo antes de guardar.");
  const fila = { nombre, datos };
  const q = E.ed.id
    ? db.from("itinerarios").update(fila).eq("id", E.ed.id).select("id").single()
    : db.from("itinerarios").insert({ ...fila, hermandad_id: E.hid, orden: (E.cache.its?.length || 0) }).select("id").single();
  const { data, error } = await q;
  if (fallo(error)) return;
  E.ed.id = data.id; E.ed.nombre = nombre;
  toast(E.ed.publicado ? "Guardado. Los móviles lo recibirán al sincronizar." : "Guardado como borrador. Publícalo cuando esté listo.");
}
async function edBorrar() {
  if (!confirm("¿Borrar este itinerario? No se puede deshacer.")) return;
  const { error } = await db.from("itinerarios").delete().eq("id", E.ed.id);
  if (!fallo(error)) { toast("Borrado."); pintar(); }
}

// ---------------------------------------------------------------- códigos
const ROLES = { diputado_mayor: "Diputado Mayor de Gobierno", fiscal: "Fiscal", consulta: "Solo consulta" };
function codigoAleatorio() { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const b = crypto.getRandomValues(new Uint8Array(8)); const s = [...b].map((x) => A[x % A.length]).join(""); return s.slice(0, 4) + "-" + s.slice(4); }
async function vCodigos(h) {
  const m = $("#main");
  const [{ data: cs, error }, { data: its }] = await Promise.all([
    db.from("codigos").select("*").eq("hermandad_id", h.id).order("creado", { ascending: false }),
    db.from("itinerarios").select("datos").eq("hermandad_id", h.id),
  ]);
  if (fallo(error)) return;
  const secciones = {}; (its || []).forEach((i) => i.datos.secciones.forEach((s) => (secciones[s.id] = s.nombre)));
  E.cache.secciones = secciones;
  m.innerHTML = `
    <div class="fila"><div><div class="rotulo">${esc(h.nombre)}</div><h1>Códigos de acceso</h1></div><div class="esp"></div>
      <button class="b p" onclick="dlgCodigo()">+ Nuevo código</button></div>
    <p class="sub">Cada fiscal activa la app con un código. Puedes hacer uno por persona o uno por sección que sirva para varios móviles.</p>
    <div class="tarjeta" style="padding:6px 8px">
    ${cs.length ? `<table><thead><tr><th>Código</th><th>Para</th><th>Rol</th><th>Sección</th><th>Usos</th><th>Caduca</th><th></th></tr></thead><tbody>
    ${cs.map((c) => `<tr style="${c.activo ? "" : "opacity:.5"}">
      <td><span class="codigo">${c.codigo}</span></td><td>${esc(c.etiqueta)}</td><td>${ROLES[c.rol] || c.rol}</td>
      <td>${esc(secciones[c.seccion] || c.seccion || "—")}</td><td class="num">${c.usos} / ${c.usos_max}</td>
      <td style="font-size:13px;color:var(--tinta2)">${c.caduca ? fmtFecha(c.caduca) : "—"}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="b mini" onclick="copiarCodigo('${c.codigo}')">Copiar mensaje</button>
        <button class="b mini" onclick="activarCodigo('${c.id}',${!c.activo})">${c.activo ? "Desactivar" : "Activar"}</button>
      </td></tr>`).join("")}</tbody></table>` : `<div class="vacio">Sin códigos todavía.</div>`}
    </div>`;
}
function dlgCodigo() {
  const sec = E.cache.secciones || {};
  abrirDialogo(`<form><h2>Nuevo código</h2><p class="sub" style="margin:6px 0 16px">Se genera solo. Compártelo por WhatsApp con quien vaya a usarlo.</p>
    <div class="rejilla" style="grid-template-columns:1fr 1fr">
      <label class="campo" style="grid-column:1/-1">Para quién<input name="etiqueta" required placeholder="Fiscal de cruz de guía"></label>
      <label class="campo">Rol<select name="rol">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === "fiscal" ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="campo">Sección<select name="seccion"><option value="">Que elija</option>${Object.entries(sec).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select></label>
      <label class="campo">Móviles que pueden usarlo<input name="usos_max" type="number" min="1" max="200" value="1"></label>
      <label class="campo">Caduca (opcional)<input name="caduca" type="date"></label>
    </div>
    <div class="fila" style="margin-top:20px;justify-content:flex-end"><button type="button" class="b" data-cerrar>Cancelar</button><button class="b p">Crear</button></div></form>`,
  async (v) => {
    const { error } = await db.from("codigos").insert({
      hermandad_id: E.hid, codigo: codigoAleatorio(), etiqueta: v.etiqueta, rol: v.rol, seccion: v.seccion || null,
      usos_max: +v.usos_max || 1, caduca: v.caduca ? new Date(v.caduca + "T23:59:59").toISOString() : null,
    });
    if (fallo(error)) return false;
    toast("Código creado"); pintar();
  });
}
function copiarCodigo(c) {
  const h = E.hermandades.find((x) => x.id === E.hid);
  navigator.clipboard.writeText(`${h.nombre}: instala Statio desde Google Play y actívala con este código: ${c}`).then(() => toast("Mensaje copiado"));
}
async function activarCodigo(id, si) { const { error } = await db.from("codigos").update({ activo: si }).eq("id", id); if (!fallo(error)) pintar(); }

// ---------------------------------------------------------------- dispositivos
async function vDispositivos(h) {
  const m = $("#main");
  const [{ data: ds, error }, { data: lic }] = await Promise.all([
    db.from("dispositivos").select("*").eq("hermandad_id", h.id).order("creado", { ascending: false }),
    db.from("licencias").select("*").eq("hermandad_id", h.id).order("fin", { ascending: false }).limit(1),
  ]);
  if (fallo(error)) return;
  const activos = ds.filter((d) => !d.revocado).length;
  const max = lic?.[0]?.max_dispositivos;
  m.innerHTML = `
    <div class="fila"><div><div class="rotulo">${esc(h.nombre)}</div><h1>Móviles</h1></div></div>
    <p class="sub">${activos}${max ? ` de ${max}` : ""} móviles activos. Si das de baja uno, deja de funcionar la próxima vez que se conecte (o como mucho a los 30 días).</p>
    <div class="tarjeta" style="padding:6px 8px">
    ${ds.length ? `<table><thead><tr><th>Móvil</th><th>Rol</th><th>Sección</th><th>Alta</th><th>Última conexión</th><th>Versión</th><th></th></tr></thead><tbody>
    ${ds.map((d) => `<tr style="${d.revocado ? "opacity:.5" : ""}">
      <td><b>${esc(d.nombre)}</b><br><span style="font-size:13px;color:var(--tinta3)">${esc(d.modelo || "")}</span></td>
      <td>${ROLES[d.rol] || d.rol}</td><td>${esc(d.seccion || "—")}</td>
      <td style="font-size:13px;color:var(--tinta2)">${fmtFecha(d.creado)}</td><td style="font-size:13px;color:var(--tinta2)">${fmtFecha(d.ultimo_contacto)}</td>
      <td class="num" style="font-size:13px">${esc(d.version_app || "—")}</td>
      <td style="text-align:right;white-space:nowrap">${d.revocado
        ? `<button class="b mini" onclick="revocar('${d.id}',false)">Reactivar</button> <button class="b mini peligro" onclick="borrarDisp('${d.id}')">Borrar</button>`
        : `<button class="b mini peligro" onclick="revocar('${d.id}',true)">Dar de baja</button>`}</td></tr>`).join("")}
    </tbody></table>` : `<div class="vacio">Ningún móvil activado todavía.</div>`}</div>`;
}
async function revocar(id, si) { const { error } = await db.from("dispositivos").update({ revocado: si }).eq("id", id); if (!fallo(error)) pintar(); }
async function borrarDisp(id) { if (!confirm("¿Borrar este móvil del listado?")) return; const { error } = await db.from("dispositivos").delete().eq("id", id); if (!fallo(error)) pintar(); }

// ---------------------------------------------------------------- hermandad
function vHermandad(h) {
  $("#main").innerHTML = `
    <div class="rotulo">${esc(h.nombre)}</div><h1>Datos de la hermandad</h1><p class="sub">Lo que ven los fiscales en la cabecera de la app.</p>
    <div class="tarjeta fila" style="margin-bottom:16px;gap:20px">
      <div id="escPrev">${escudoHtml(h, 96)}</div>
      <div style="flex:1;min-width:220px"><h2>Escudo</h2>
        <p style="color:var(--tinta2);margin:4px 0 12px;font-size:14px">Aparece en la app de los fiscales. Mejor un PNG con fondo transparente. Se reduce solo a 512 px.</p>
        <div class="fila"><label class="b" style="cursor:pointer">${h.escudo_url ? "Cambiar escudo" : "Subir escudo"}<input type="file" id="fEsc" accept="image/png,image/jpeg,image/webp" hidden></label>
        ${h.escudo_url ? `<button class="b peligro" id="qEsc">Quitar</button>` : ""}</div>
        <p style="color:var(--tinta3);margin:10px 0 0;font-size:13px">Los móviles lo descargan la próxima vez que sincronicen y lo guardan para usarlo sin red.</p>
      </div>
    </div>
    <form id="fh" class="tarjeta"><div class="rejilla">
      <label class="campo" style="grid-column:1/-1">Nombre completo<input name="nombre" value="${esc(h.nombre)}" required></label>
      <label class="campo">Nombre corto<input name="nombre_corto" value="${esc(h.nombre_corto || "")}"></label>
      <label class="campo">Ciudad<input name="ciudad" value="${esc(h.ciudad)}"></label>
      <label class="campo">Día de salida<input name="dia_salida" value="${esc(h.dia_salida || "")}" placeholder="Martes Santo"></label>
      <label class="campo">Color<input name="color" type="color" value="${esc(h.color)}" style="height:40px;padding:4px"></label>
    </div><div class="fila" style="margin-top:18px"><div class="esp"></div><button class="b p">Guardar</button></div></form>`;
  $("#fEsc").addEventListener("change", async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      toast("Subiendo escudo…");
      const png = await prepararEscudo(f);
      const ruta = `${h.id}/escudo-${Date.now()}.png`;
      const { error: e1 } = await db.storage.from("escudos").upload(ruta, png, { contentType: "image/png", cacheControl: "31536000" });
      if (e1) throw e1;
      const url = db.storage.from("escudos").getPublicUrl(ruta).data.publicUrl;
      const viejo = h.escudo_url?.split("/escudos/")[1];
      const { error: e2 } = await db.from("hermandades").update({ escudo_url: url }).eq("id", h.id);
      if (e2) throw e2;
      if (viejo) await db.storage.from("escudos").remove([decodeURIComponent(viejo)]);
      toast("Escudo actualizado"); cargar();
    } catch (e) { fallo(e); }
  });
  $("#qEsc")?.addEventListener("click", async () => {
    if (!confirm("¿Quitar el escudo? Se mostrarán las iniciales.")) return;
    const viejo = h.escudo_url?.split("/escudos/")[1];
    const { error } = await db.from("hermandades").update({ escudo_url: null }).eq("id", h.id);
    if (fallo(error)) return;
    if (viejo) await db.storage.from("escudos").remove([decodeURIComponent(viejo)]);
    toast("Escudo quitado"); cargar();
  });
  $("#fh").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const v = Object.fromEntries(new FormData(ev.target));
    const { error } = await db.from("hermandades").update({ ...v, nombre_corto: v.nombre_corto || null, dia_salida: v.dia_salida || null }).eq("id", h.id);
    if (!fallo(error)) { toast("Guardado"); cargar(); }
  });
}
function dlgHermandad() {
  abrirDialogo(`<form><h2>Nueva hermandad</h2><p class="sub" style="margin:6px 0 16px">Después dale una licencia y un administrador.</p>
    <div class="rejilla" style="grid-template-columns:1fr 1fr">
      <label class="campo" style="grid-column:1/-1">Nombre<input name="nombre" required placeholder="Hermandad de …"></label>
      <label class="campo">Identificador<input name="slug" required pattern="[a-z0-9-]{3,40}" placeholder="san-esteban"></label>
      <label class="campo">Ciudad<input name="ciudad" value="Sevilla"></label>
      <label class="campo">Día de salida<input name="dia_salida" placeholder="Martes Santo"></label>
      <label class="campo">Cuenta interna<select name="interna"><option value="false">No</option><option value="true">Sí (pruebas)</option></select></label>
    </div>
    <div class="fila" style="margin-top:20px;justify-content:flex-end"><button type="button" class="b" data-cerrar>Cancelar</button><button class="b p">Crear</button></div></form>`,
  async (v) => {
    const { data, error } = await db.from("hermandades").insert({ ...v, interna: v.interna === "true", dia_salida: v.dia_salida || null }).select("id").single();
    if (fallo(error)) return false;
    E.hid = data.id; E.vista = "licencias"; toast("Hermandad creada. Ahora dale una licencia."); cargar();
  });
}

// ---------------------------------------------------------------- licencias (superadmin)
async function vLicencias(h) {
  const { data: ls, error } = await db.from("licencias").select("*").eq("hermandad_id", h.id).order("fin", { ascending: false });
  if (fallo(error)) return;
  const hoy = new Date().toISOString().slice(0, 10);
  $("#main").innerHTML = `
    <div class="fila"><div><div class="rotulo">${esc(h.nombre)}</div><h1>Licencias</h1></div><div class="esp"></div><button class="b p" onclick="dlgLicencia()">+ Nueva licencia</button></div>
    <p class="sub">Vale la que esté activa y en fechas. Los móviles renuevan su permiso cada vez que sincronizan; sin licencia, dejan de poder salir en vivo como mucho 30 días después.</p>
    <div class="tarjeta" style="padding:6px 8px">${ls.length ? `<table><thead><tr><th>Desde</th><th>Hasta</th><th>Móviles</th><th>Estado</th><th>Notas</th><th></th></tr></thead><tbody>
    ${ls.map((l) => { const vig = l.estado === "activa" && l.inicio <= hoy && l.fin >= hoy; return `<tr>
      <td class="num">${l.inicio}</td><td class="num">${l.fin}</td><td class="num">${l.max_dispositivos}</td>
      <td>${vig ? `<span class="pastilla" style="--c:var(--bien)">Vigente</span>` : l.estado === "suspendida" ? `<span class="pastilla" style="--c:var(--mal)">Suspendida</span>` : `<span class="pastilla">Fuera de fechas</span>`}</td>
      <td style="color:var(--tinta2)">${esc(l.notas || "")}</td>
      <td style="text-align:right"><button class="b mini" onclick="suspender('${l.id}','${l.estado === "activa" ? "suspendida" : "activa"}')">${l.estado === "activa" ? "Suspender" : "Reactivar"}</button></td></tr>`; }).join("")}
    </tbody></table>` : `<div class="vacio">Sin licencia: los móviles no podrán activarse.</div>`}</div>`;
}
function dlgLicencia() {
  const hoy = new Date(); const fin = new Date(hoy.getFullYear() + 1, 5, 30);
  abrirDialogo(`<form><h2>Nueva licencia</h2>
    <div class="rejilla" style="grid-template-columns:1fr 1fr;margin-top:16px">
      <label class="campo">Desde<input name="inicio" type="date" required value="${hoy.toISOString().slice(0, 10)}"></label>
      <label class="campo">Hasta<input name="fin" type="date" required value="${fin.toISOString().slice(0, 10)}"></label>
      <label class="campo">Móviles<input name="max_dispositivos" type="number" min="1" max="500" value="15"></label>
      <label class="campo">Notas<input name="notas" placeholder="Factura 2027-004"></label>
    </div>
    <div class="fila" style="margin-top:20px;justify-content:flex-end"><button type="button" class="b" data-cerrar>Cancelar</button><button class="b p">Crear</button></div></form>`,
  async (v) => { const { error } = await db.from("licencias").insert({ ...v, hermandad_id: E.hid, max_dispositivos: +v.max_dispositivos }); if (fallo(error)) return false; toast("Licencia creada"); pintar(); });
}
async function suspender(id, estado) { const { error } = await db.from("licencias").update({ estado }).eq("id", id); if (!fallo(error)) pintar(); }

// ---------------------------------------------------------------- administradores (superadmin)
async function vAdmins(h) {
  const { data: as, error } = await db.from("admins").select("*").eq("hermandad_id", h.id).order("creado");
  if (fallo(error)) return;
  $("#main").innerHTML = `
    <div class="fila"><div><div class="rotulo">${esc(h.nombre)}</div><h1>Administradores</h1></div><div class="esp"></div><button class="b p" onclick="dlgAdmin()">+ Añadir</button></div>
    <p class="sub">Pueden entrar en este panel con su correo y gestionar itinerarios, códigos y móviles de esta hermandad.</p>
    <div class="tarjeta" style="padding:6px 8px">${as.length ? `<table><thead><tr><th>Correo</th><th>Nombre</th><th>Desde</th><th></th></tr></thead><tbody>
    ${as.map((a) => `<tr><td>${esc(a.email)}</td><td>${esc(a.nombre || "")}</td><td style="font-size:13px;color:var(--tinta2)">${fmtFecha(a.creado)}</td>
      <td style="text-align:right"><button class="b mini peligro" onclick="quitarAdmin('${esc(a.email)}')">Quitar</button></td></tr>`).join("")}
    </tbody></table>` : `<div class="vacio">Nadie todavía.</div>`}</div>`;
}
function dlgAdmin() {
  abrirDialogo(`<form><h2>Añadir administrador</h2>
    <div class="rejilla" style="grid-template-columns:1fr;margin-top:16px">
      <label class="campo">Correo<input name="email" type="email" required></label>
      <label class="campo">Nombre<input name="nombre" placeholder="Diputado Mayor de Gobierno"></label>
    </div>
    <div class="fila" style="margin-top:20px;justify-content:flex-end"><button type="button" class="b" data-cerrar>Cancelar</button><button class="b p">Añadir</button></div></form>`,
  async (v) => { const { error } = await db.from("admins").insert({ hermandad_id: E.hid, email: v.email.trim().toLowerCase(), nombre: v.nombre || null }); if (fallo(error)) return false; toast("Añadido. Ya puede entrar con su correo."); pintar(); });
}
async function quitarAdmin(email) { if (!confirm(`¿Quitar a ${email}?`)) return; const { error } = await db.from("admins").delete().eq("hermandad_id", E.hid).eq("email", email); if (!fallo(error)) pintar(); }

iniciar();
</script>
</body>
</html>
